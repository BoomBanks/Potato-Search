<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MTG Spike Tool</title>
<meta name="theme-color" content="#16171a">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f4f4f6;--card:#fff;--fg:#1b1b1d;--mute:#6d6d73;--line:#e2e2e6;--acc:#2d6ae3;--g:#1e9a52;--y:#d29200;--r:#d24343;--chip:#ececf0}
@media (prefers-color-scheme:dark){:root{--bg:#121315;--card:#1c1d21;--fg:#ececee;--mute:#9b9ba2;--line:#2d2e33;--acc:#6f9dff;--chip:#2a2b30}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg);padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{padding:16px 16px 4px}
h1{font-size:19px;margin:0}
h2{font-size:15px;margin:18px 4px 6px;color:var(--mute);font-weight:600}
.sub{color:var(--mute);font-size:12px}
main{padding:0 12px;max-width:760px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:8px 0 7px;font-size:10.5px;font-family:inherit}
nav button b{display:block;font-size:19px;font-weight:400;line-height:1.2}
nav button.on{color:var(--acc)}
.seg{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:20px;padding:6px 12px;font:inherit;font-size:13px}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;display:flex;gap:10px}
.item img{width:54px;height:75px;border-radius:4px;object-fit:cover;flex:none;background:var(--chip)}
.body{flex:1;min-width:0}
.top{display:flex;justify-content:space-between;gap:6px;align-items:flex-start}
.name{font-weight:600;overflow-wrap:anywhere}
.star{border:0;background:none;font-size:20px;line-height:1;color:var(--mute);padding:0 2px}
.star.on{color:#e7a600}
.meta{color:var(--mute);font-size:12px}
.row{font-size:13px;margin-top:3px}
.up{color:var(--g);font-weight:600}.down{color:var(--r);font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.l-g{background:var(--g)}.l-y{background:var(--y)}.l-r{background:var(--r)}
.tag{display:inline-block;background:var(--chip);border-radius:6px;padding:0 6px;font-size:11px;margin-left:4px;font-weight:500;color:var(--fg)}
.new{background:var(--acc);color:#fff}
.rl{background:#7a4fd6;color:#fff;font-weight:700}
.warn{background:var(--r);color:#fff}
.okt{background:var(--g);color:#fff}
.ytt{background:#e02c2c;color:#fff}
.vids{margin-top:5px;font-size:12px}
.vids a{display:block;color:var(--acc);text-decoration:none;padding:2px 0;overflow-wrap:anywhere}
.vids span{color:var(--mute)}
.seg.f{margin:4px 0}
.seg.f button{padding:4px 10px;font-size:12px}
.seg.f span{font-size:12px;color:var(--mute);align-self:center;margin-right:2px}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.links a,.links button{font:inherit;font-size:12px;text-decoration:none;color:var(--acc);border:1px solid var(--line);border-radius:8px;padding:3px 8px;background:none}
.note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;font-size:13px;color:var(--mute)}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
form label{font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:3px}
form .full{grid-column:1/-1}
.real{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;flex-wrap:wrap}
.real input{width:100px;padding:5px 8px}
.real b{white-space:nowrap}
input{font:inherit;font-size:16px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);width:100%}
.btn{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--acc);color:#fff;font-weight:600}
.btn.alt{background:var(--chip);color:var(--fg)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.sum b{display:block;font-size:17px}
.sum span{font-size:11px;color:var(--mute)}
details{font-size:13px;color:var(--mute);margin:6px 4px}
</style>
</head>
<body>
<header>
  <h1>MTG Spike Tool</h1>
  <div class="sub" id="upd">Lade Daten …</div>
</header>
<main id="main"></main>
<nav id="nav">
  <button data-t="spikes" class="on"><b>📈</b>Spikes</button>
  <button data-t="hype"><b>📡</b>Hype</button>
  <button data-t="cand"><b>🎯</b>Kandidaten</button>
  <button data-t="watch"><b>⭐</b>Watchlist</button>
  <button data-t="ledger"><b>💶</b>Käufe</button>
</nav>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const usd = v => v == null ? "–" : "$" + v.toFixed(2);
const eur = v => v == null ? "–" : v.toFixed(2).replace(".", ",") + " €";
const pc = v => v == null ? "" : `<span class="${v >= 0 ? "up" : "down"}">${v >= 0 ? "+" : ""}${Math.round(v * 100)} %</span>`;
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} }
};
const LIGHT = {g: "Legitim: Aufmerksamkeit (EDHREC/YouTube) oder Cardmarket ziehen mit", y: "Unklar / früh: noch keine Bestätigung", r: "Fragwürdig: Preis springt ohne Rückhalt (oft Ausreißer)"};
const HYPELIGHT = {g: "Legitim: US-Preis zieht mit", y: "Früh: Aufmerksamkeit steigt, Preis noch ruhig", r: "Fragwürdig: Preis fällt trotz Aufmerksamkeit"};

let D = null, PRICES = null, tab = "spikes", spikeView = "log", hypeView = "edh";
let rlF = store.get("rlF", "all"), rarF = store.get("rarF", "all"), foilF = store.get("foilF", "all");
const RAR = {C: "Common", U: "Uncommon", R: "Rare", M: "Mythic"};
function filt(arr) {
  return arr.filter(e => (rlF === "all" || (rlF === "only" ? e.rl : !e.rl)) && (rarF === "all" || e.r === rarF) && (foilF === "all" || (foilF === "foil" ? e.f : !e.f)));
}
function filterBar() {
  const b = (k, v, cur, label) => `<button data-${k}="${v}" class="${cur === v ? "on" : ""}">${label}</button>`;
  return `<div class="seg f"><span>Reserved List:</span>${b("rlf", "all", rlF, "Alle")}${b("rlf", "only", rlF, "Nur RL")}${b("rlf", "hide", rlF, "RL ausblenden")}</div>
    <div class="seg f"><span>Seltenheit:</span>${b("rarf", "all", rarF, "Alle")}${b("rarf", "U", rarF, "Uncommon")}${b("rarf", "R", rarF, "Rare")}${b("rarf", "M", rarF, "Mythic")}</div>
    <div class="seg f"><span>Foil:</span>${b("foilf", "all", foilF, "Alle")}${b("foilf", "nonfoil", foilF, "Non-Foil")}${b("foilf", "foil", foilF, "Nur Foil")}</div>`;
}
let watch = store.get("watch", {});
let realP = store.get("realT", {});   // vom User eingetippte Warenkorb-Gesamtpreise (Karte + Versand)
let ledger = store.get("ledger", []);
const lastVisit = store.get("lastVisit", null);

function cmSearch(name) {
  // schlichter Suchlink wie bei einer normalen Suche auf Cardmarket (ohne Zusätze, die deren Schutz auslösen können)
  const q = String(name || "").split(" // ")[0].replace(/['\u2019"]/g, " ").replace(/\s+/g, " ").trim();
  return "https://www.cardmarket.com/en/Magic/Products/Search?searchString=" + encodeURIComponent(q);
}
// Höchster Einkaufspreis auf Cardmarket, bei dem nach Gebühren und Kosten noch das Gewinnziel bleibt
function ship() {
  const s = (D && D.settings) || {};
  return {low: s.ship_low ?? 2, high: s.ship_high ?? 15.49, limit: s.ship_limit ?? 25};
}
function shipFor(price) { const v = ship(); return price >= v.limit ? v.high : v.low; }
// erwarteter Verkaufserlös nach Gebühr (ohne Einkauf und Versand)
function netSale(usdNow) { const s = D.settings; return usdNow * D.fx * s.catchup * (1 - s.fee); }
// Max. gesamt = was du insgesamt (Karte + Versand) höchstens zahlen darfst, damit das Gewinnziel bleibt
function maxTotal(usdNow) { return !D || !usdNow ? null : +(netSale(usdNow) - D.settings.min_profit).toFixed(2); }
function realProfit(usdNow, total) {
  if (!D || !usdNow || total == null) return null;
  return +(netSale(usdNow) - total).toFixed(2);
}
function realText(usdNow, price) {
  const g = realProfit(usdNow, price);
  if (g == null) return usdNow ? "eintippen → Gewinn" : "";
  return `Gewinn: <b class="${g >= D.settings.min_profit ? "up" : "down"}">${eur(g)}</b>${g < D.settings.min_profit ? (g > 0 ? " (unter Ziel)" : " (Verlust)") : " ✓"}`;
}
function realRow(key, usdNow, label) {
  if (!usdNow) return "";
  const v = realP[key];
  return `<div class="real">${label || ""}Warenkorb gesamt €
    <input inputmode="decimal" placeholder="Karte+Versand" data-real="${esc(key)}" data-usd="${usdNow}" value="${v != null ? String(v).replace(".", ",") : ""}">
    <span data-realout="${esc(key)}">${realText(usdNow, v)}</span></div>`;
}
function maxRow(usdNow, eurNow, label) {
  const t = maxTotal(usdNow);
  if (t == null) return "";
  if (t <= 0) return `<div class="row meta">${label || ""}Max. gesamt: kein ${eur(D.settings.min_profit)}-Gewinn möglich</div>`;
  const v = ship();
  const est = eurNow != null ? eurNow + shipFor(eurNow) : null;   // Trend-Preis + geschätzter Versand
  const ok = est != null && est <= t;
  // Orientierung: wie teuer darf die Karte bei günstigem bzw. teurem Versand sein?
  const lowCard = Math.min(t - v.low, v.limit - 0.01), highCard = t - v.high;
  const hints = [];
  if (lowCard > 0) hints.push(`bei ${eur(v.low)} Versand: Karte bis ${eur(+lowCard.toFixed(2))}`);
  hints.push(highCard >= v.limit ? `bei ${eur(v.high)} Versand: Karte bis ${eur(+highCard.toFixed(2))}` : `teurer Versand (${eur(v.high)}) lohnt nicht`);
  return `<div class="row">${label || ""}Max. gesamt (Karte + Versand): <b class="${est == null ? "" : ok ? "up" : "down"}">${eur(t)}</b>${est != null ? ` <span class="meta">(${ok ? "Trend-Preis passt ✓" : "Trend-Preis zu teuer"})</span>` : ""}</div>
    <div class="row meta">${hints.join(" · ")}</div>`;
}
function newsLink(name) { return "https://www.google.com/search?tbm=nws&q=" + encodeURIComponent('"' + name + '" mtg'); }
function ytLink(name) { return "https://www.youtube.com/results?search_query=" + encodeURIComponent('"' + name.split(" // ")[0] + '" mtg'); }
function redditLink(name) { return "https://www.reddit.com/r/mtgfinance/search/?q=" + encodeURIComponent(name); }

function cardHTML(e, opt = {}) {
  const lights = opt.hype ? HYPELIGHT : LIGHT;
  const starOn = watch[e.id] ? " on" : "";
  let lines = "";
  if (opt.ytl) {
    lines += `<div class="row">US 7 Tage ${usd(e.old)} → <b>${usd(e.new)}</b> ${pc(e.ch)} · EU ${eur(e.eur)} ${pc(e.euch)}</div>`;
  } else if (opt.hype) {
    lines += `<div class="row">EDHREC-Rang ${e.rk_old} → <b>${e.rk}</b> ${pc(e.att)}</div>`;
    lines += `<div class="row">US ${usd(e.old)} → ${usd(e.new)} ${pc(e.ch)} · EU ${eur(e.eur)} ${pc(e.euch)}</div>`;
  } else {
    lines += `<div class="row">US ${usd(e.old)} → <b>${usd(e.new)}</b> ${pc(e.ch)}${e.vs != null ? ` <span class="meta">(${Math.round(e.vs * 100)} Pp. über RL-Schnitt)</span>` : ""}</div>`;
    lines += `<div class="row">Cardmarket ${eur(e.eur)} ${e.euch != null ? "(" + pc(e.euch) + ")" : ""}${e.p != null ? ` · Gewinn-Schätzung <b class="${e.p >= 0 ? "up" : "down"}">${eur(e.p)}</b>` : ""}</div>`;
  }
  const rk = e.id + "|" + (e.f ? 1 : 0);
  lines += maxRow(e.new, e.eur) + realRow(rk, e.new);
  return `<div class="item">
    ${e.img ? `<img loading="lazy" src="${esc(e.img)}" alt="">` : ""}
    <div class="body">
      <div class="top"><div class="name"><span class="dot l-${e.l}" title="${esc(lights[e.l])}"></span>${esc(e.n)}${e.rl ? '<span class="tag rl">RL</span>' : ""}${e.yt ? `<span class="tag ytt" title="In ${e.yt} YouTube-Video(s) der letzten 7 Tage erwähnt">▶ ${e.yt}</span>` : ""}${e.f ? '<span class="tag">Foil</span>' : ""}${opt.isNew ? '<span class="tag new">neu</span>' : ""}${e.bo ? '<span class="tag warn">möglicher Buyout</span>' : ""}${opt.conf && e.rl ? (e.ok === 1 ? '<span class="tag okt">bestätigt</span>' : e.ok === 0 ? '<span class="tag warn">nicht gehalten</span>' : '<span class="tag">unbestätigt</span>') : ""}</div>
      <button class="star${starOn}" data-star="${esc(e.id)}" data-name="${esc(e.n)}" data-set="${esc(e.s)}">★</button></div>
      <div class="meta">${esc(e.s)} · ${RAR[e.r] || "Sonder"} · ${esc(e.bo ? "Möglicher Buyout: Preis steigt, aber weder Aufmerksamkeit noch Cardmarket ziehen mit" : lights[e.l])}</div>
      ${lines}
      ${e.ytv ? `<div class="vids">${e.ytv.map(v => `<a href="${esc(v.u)}" target="_blank" rel="noopener">▶ ${esc(v.t)} <span>· ${esc(v.ch)} · ${esc(v.d)}</span></a>`).join("")}</div>` : ""}
      <div class="links">
        <a href="${esc(cmSearch(e.n))}" target="_blank" rel="noopener">Cardmarket</a>
        <a href="${esc(e.sf)}" target="_blank" rel="noopener">Scryfall</a>
        ${e.ed ? `<a href="${esc(e.ed)}" target="_blank" rel="noopener">EDHREC</a>` : ""}
        <a href="${newsLink(e.n)}" target="_blank" rel="noopener">Warum? (News)</a>
        <a href="${redditLink(e.n)}" target="_blank" rel="noopener">Reddit</a>
        <a href="${ytLink(e.n)}" target="_blank" rel="noopener">YouTube</a>
        ${opt.buy ? `<button data-buy="${esc(e.n)}" data-key="${esc(rk)}" data-price="${e.eur ?? ""}">+ Kaufliste</button>` : ""}
      </div>
    </div></div>`;
}

function list(arr, opt) { return arr.length ? arr.map(e => cardHTML(e, opt)).join("") : `<div class="empty">${opt?.empty || "Nichts gefunden."}</div>`; }

function startHint() {
  if (!D || D.days >= 2) return "";
  return `<div class="note">📅 Das Tool sammelt gerade erst Daten. Spikes erscheinen ab dem 2. Tag, die 7-Tage-Ansicht, der Hype-Radar und die Kandidaten werden nach etwa einer Woche richtig aussagekräftig.</div>`;
}

function renderSpikes() {
  let h = `<div class="seg">
    <button data-v="log" class="${spikeView === "log" ? "on" : ""}">Letzte 30 Tage</button>
    <button data-v="today" class="${spikeView === "today" ? "on" : ""}">Heute</button>
    <button data-v="week" class="${spikeView === "week" ? "on" : ""}">7 Tage</button></div>` + filterBar() + startHint();
  const st = D.settings;
  if (spikeView === "week") {
    h += `<div class="note">Preisänderung seit ${esc(D.base7 || "–")} (ca. 7 Tage), mind. +${Math.round(st.min_change * 100)} % und $${st.min_usd}.${st.rl_week_extra != null ? `<br><b>RL-Karten:</b> ab $${st.rl_min_usd} und mind. ${Math.round(st.rl_week_extra * 100)} Prozentpunkte stärker als der RL-Schnitt${D.rl_avg != null ? ` (aktuell ${pc(D.rl_avg)})` : " (wird nach ca. 7 Tagen berechnet)"}.` : ""}</div>`;
    h += list(filt(D.week), {buy: true, empty: "Noch keine 7-Tage-Daten."});
  } else {
    if (st.rl_min_usd != null) h += `<details><summary>Regeln für Spikes</summary>Normal: ab $${st.min_usd} und mind. +${Math.round(st.min_change * 100)} % an einem Tag.<br>Reserved List: ab $${st.rl_min_usd} und mind. +${Math.round(st.rl_min_change * 100)} % oder +$${st.rl_min_abs} an einem Tag. „Bestätigt“, wenn der Preis am Folgetag noch hält.</details>`;
    const items = filt(spikeView === "today" ? D.log.filter(e => e.d === D.today) : D.log);
    if (spikeView === "log" && lastVisit) {
      const n = D.log.filter(e => e.d > lastVisit).length;
      h += `<div class="note">Seit deinem letzten Besuch (${esc(lastVisit)}): <b>${n}</b> neue Spikes.</div>`;
    }
    let cur = null;
    if (!items.length) h += `<div class="empty">Keine Spikes ${spikeView === "today" ? "heute" : "in den letzten 30 Tagen"}.</div>`;
    for (const e of items) {
      if (e.d !== cur) { cur = e.d; h += `<h2>${new Date(cur + "T12:00").toLocaleDateString("de-AT", {weekday: "long", day: "numeric", month: "long"})}</h2>`; }
      h += cardHTML(e, {buy: true, conf: true, isNew: lastVisit && e.d > lastVisit});
    }
  }
  return h;
}

function renderHype() {
  const seg = `<div class="seg"><button data-hv="edh" class="${hypeView === "edh" ? "on" : ""}">EDHREC</button><button data-hv="yt" class="${hypeView === "yt" ? "on" : ""}">▶ YouTube</button></div>`;
  if (hypeView === "yt") {
    const i = D.yt_info || {ok: [], bad: [], videos: 0};
    return seg + filterBar() + `<div class="note">Karten, die in den letzten 7 Tagen in Videos von MTG-Kanälen vorkamen (Titel und Beschreibung), sortiert nach Anzahl der Videos. Die Videos sind direkt verlinkt.
      <details><summary>Durchsuchte Kanäle</summary>${i.ok.length} Kanäle, ${i.videos} Videos.${i.bad.length ? `<br>Nicht erreichbar: ${esc(i.bad.join(", "))}` : ""}<br>Achtung: Wird eine Karte nur in einer langen Liste erwähnt, kann der Treffer zufällig sein – Video kurz ansehen.</details></div>` +
      list(filt(D.ytl || []), {ytl: true, buy: true, empty: D.ytl ? "Keine Karten in aktuellen Videos gefunden." : "YouTube-Daten kommen mit dem nächsten Update."});
  }
  return seg + filterBar() + startHint() + `<div class="note">Karten, deren Beliebtheit auf EDHREC (Commander) in ca. 7 Tagen deutlich gestiegen ist.<br>
    <span class="dot l-g"></span>US-Preis zieht mit · <span class="dot l-y"></span>früh, Preis noch ruhig · <span class="dot l-r"></span>Preis fällt trotzdem</div>` +
    list(filt(D.hype), {hype: true, buy: true, empty: "Noch keine Hype-Signale."});
}

function renderCand() {
  const s = D.settings;
  return filterBar() + startHint() + `<div class="note">Kaufchancen: US-Preis steigt, Cardmarket hinkt hinterher, Ampel nicht rot und geschätzter Gewinn mind. ${eur(s.min_profit)}.
    <details><summary>Wie wird geschätzt?</summary>Annahme: Cardmarket zieht auf ${Math.round(s.catchup * 100)} % des US-Preises (umgerechnet, 1 $ = ${D.fx.toFixed(3).replace(".", ",")} €) nach. Davon gehen ${Math.round(s.fee * 100)} % Gebühr und der Versand beim Einkauf ab (${eur(ship().low)} unter ${eur(ship().limit)}, ${eur(ship().high)} ab ${eur(ship().limit)}), minus dein Einkaufspreis. Kaufst du mehrere Karten beim selben Verkäufer, teilt sich der Versand – dann ist die Rechnung vorsichtig.<br><b>Max. gesamt</b> = was du insgesamt (Karte + Versand, wie im Warenkorb) höchstens zahlen darfst, damit dir mind. ${eur(s.min_profit)} Gewinn bleiben. Bei mehreren Karten vom selben Verkäufer: die Werte zusammenzählen und mit dem Warenkorb vergleichen. Nur eine Schätzung – Grund des Spikes immer prüfen!</details></div>` +
    list(filt(D.cand), {buy: true, empty: "Heute keine Kandidaten."});
}

async function renderWatch() {
  const ids = Object.keys(watch);
  if (!ids.length) return `<div class="empty">Noch nichts markiert.<br>Tippe bei einer Karte auf ★, um sie zu beobachten.</div>`;
  if (!PRICES) { try { PRICES = await (await fetch("prices.json?" + Date.now())).json(); } catch { PRICES = {}; } }
  return ids.map(id => {
    const w = watch[id], p = PRICES[id];
    const now = p ? (p[2] ?? p[3]) : null, wk = p ? p[6] : null;
    return `<div class="item"><div class="body">
      <div class="top"><div class="name">${esc(w.n)}${p && p[8] ? '<span class="tag rl">RL</span>' : ""}</div><button class="star on" data-star="${esc(id)}">★</button></div>
      <div class="meta">${esc(w.s)} · beobachtet seit ${esc(w.since)}</div>
      ${p ? `<div class="row">US ${usd(p[2])}${p[3] ? " / Foil " + usd(p[3]) : ""} · 7 Tage ${pc(now && wk ? (now - wk) / wk : null)}</div>
      <div class="row">Cardmarket ${eur(p[4])}${p[5] ? " / Foil " + eur(p[5]) : ""}</div>
      ${maxRow(p[2], p[4], p[3] ? "Non-Foil: " : "")}${realRow(id + "|0", p[2], p[3] ? "Non-Foil: " : "")}${p[3] ? maxRow(p[3], p[5], "Foil: ") + realRow(id + "|1", p[3], "Foil: ") : ""}
      <div class="row meta">Beim Markieren: US ${usd(w.usd)}${w.usd && now ? " → jetzt " + pc((now - w.usd) / w.usd) : ""}</div>` : `<div class="row meta">Keine aktuellen Preise.</div>`}
      <div class="links"><a href="${cmSearch(w.n)}" target="_blank" rel="noopener">Cardmarket</a>
      <a href="https://scryfall.com/search?q=${encodeURIComponent('!"' + w.n + '"')}" target="_blank" rel="noopener">Scryfall</a>
      <a href="${newsLink(w.n)}" target="_blank" rel="noopener">News</a></div>
    </div></div>`;
  }).join("");
}

function profitOf(x) {
  if (x.sell === "" || x.sell == null) return null;
  return +(x.sell * (1 - (x.fee ?? 5) / 100) - x.buy - (x.costs || 0)).toFixed(2);
}

function renderLedger(prefill = {}) {
  let invested = 0, profit = 0, open = 0;
  for (const x of ledger) { const p = profitOf(x); if (p == null) { open++; invested += x.buy + (x.costs || 0); } else profit += p; }
  const today = new Date().toISOString().slice(0, 10);
  let h = `<div class="sum"><div><b class="${profit >= 0 ? "up" : "down"}">${eur(profit)}</b><span>Gewinn (verkauft)</span></div>
    <div><b>${eur(invested)}</b><span>gebunden</span></div><div><b>${open}</b><span>offen</span></div></div>
    <form id="lf">
      <label class="full">Karte<input name="name" required value="${esc(prefill.name || "")}"></label>
      <label>Kaufdatum<input name="date" type="date" value="${today}"></label>
      <label>Kaufpreis €<input name="buy" inputmode="decimal" required value="${prefill.price ? String(prefill.price).replace(".", ",") : ""}"></label>
      <label>Versand/Kosten €<input name="costs" inputmode="decimal" placeholder="0"></label>
      <label>Gebühr %<input name="fee" inputmode="decimal" value="5"></label>
      <label class="full">Verkaufspreis € (leer = noch nicht verkauft)<input name="sell" inputmode="decimal"></label>
      <button class="btn full" type="submit">Eintragen</button>
    </form>`;
  if (!ledger.length) h += `<div class="empty">Noch keine Einträge.</div>`;
  ledger.forEach((x, i) => {
    const p = profitOf(x);
    h += `<div class="item"><div class="body">
      <div class="top"><div class="name">${esc(x.name)}</div><span class="meta">${esc(x.date)}</span></div>
      <div class="row">Kauf ${eur(x.buy)}${x.costs ? " + " + eur(x.costs) : ""} · ${p == null ? "<b>noch offen</b>" : "Verkauf " + eur(x.sell) + " (−" + x.fee + " %)"}</div>
      ${p != null ? `<div class="row">Gewinn <b class="${p >= 0 ? "up" : "down"}">${eur(p)}</b>${p >= 0 && p < 5 ? ' <span class="meta">(unter 5 € Ziel)</span>' : ""}</div>` : ""}
      <div class="links">${p == null ? `<button data-sell="${i}">Verkauft eintragen</button>` : ""}<button data-del="${i}">Löschen</button></div>
    </div></div>`;
  });
  h += `<div class="note">Die Liste wird nur auf diesem Gerät gespeichert. Mach ab und zu eine Sicherung:</div>
    <div class="seg"><button id="exp">💾 Sicherung speichern</button><button id="imp">📂 Sicherung laden</button></div>
    <input type="file" id="impf" accept="application/json" hidden>`;
  return h;
}

const num = v => { const n = parseFloat(String(v ?? "").replace(",", ".")); return isNaN(n) ? null : n; };

async function render(prefill) {
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.t === tab));
  if (!D && tab !== "ledger" && tab !== "watch") { $("#main").innerHTML = `<div class="empty">Daten werden geladen …</div>`; return; }
  const m = $("#main");
  if (tab === "spikes") m.innerHTML = renderSpikes();
  else if (tab === "hype") m.innerHTML = renderHype();
  else if (tab === "cand") m.innerHTML = renderCand();
  else if (tab === "watch") { m.innerHTML = `<div class="empty">Lade …</div>`; m.innerHTML = await renderWatch(); }
  else m.innerHTML = renderLedger(prefill);
  window.scrollTo(0, 0);
}

document.addEventListener("click", ev => {
  const t = ev.target.closest("button");
  if (!t) return;
  if (t.dataset.t) { tab = t.dataset.t; render(); return; }
  if (t.dataset.hv) { hypeView = t.dataset.hv; render(); return; }
  if (t.dataset.v) { spikeView = t.dataset.v; render(); return; }
  if (t.dataset.rlf) { rlF = t.dataset.rlf; store.set("rlF", rlF); render(); return; }
  if (t.dataset.foilf) { foilF = t.dataset.foilf; store.set("foilF", foilF); render(); return; }
  if (t.dataset.rarf) { rarF = t.dataset.rarf; store.set("rarF", rarF); render(); return; }
  if (t.dataset.star) {
    const id = t.dataset.star;
    if (watch[id]) { delete watch[id]; t.classList.remove("on"); if (tab === "watch") render(); }
    else {
      const all = [...(D?.log || []), ...(D?.week || []), ...(D?.hype || []), ...(D?.cand || [])];
      const e = all.find(x => x.id === id);
      watch[id] = {n: t.dataset.name, s: t.dataset.set, usd: e ? e.new : null, since: new Date().toISOString().slice(0, 10)};
      t.classList.add("on");
    }
    store.set("watch", watch); return;
  }
  if (t.dataset.buy !== undefined) { const rp = realP[t.dataset.key]; tab = "ledger"; render({name: t.dataset.buy, price: rp ?? t.dataset.price}); return; }
  if (t.dataset.del !== undefined) { if (confirm("Eintrag löschen?")) { ledger.splice(+t.dataset.del, 1); store.set("ledger", ledger); render(); } return; }
  if (t.dataset.sell !== undefined) {
    const v = num(prompt("Verkaufspreis in €:")); if (v == null) return;
    ledger[+t.dataset.sell].sell = v; store.set("ledger", ledger); render(); return;
  }
  if (t.id === "exp") {
    const blob = new Blob([JSON.stringify({ledger, watch, realP}, null, 1)], {type: "application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "mtg-sicherung-" + new Date().toISOString().slice(0, 10) + ".json"; a.click(); return;
  }
  if (t.id === "imp") { $("#impf").click(); return; }
});

document.addEventListener("input", ev => {
  const el = ev.target;
  if (!el.dataset || el.dataset.real === undefined) return;
  const k = el.dataset.real, v = num(el.value);
  if (v == null) delete realP[k]; else realP[k] = v;
  store.set("realT", realP);
  document.querySelectorAll(`[data-realout="${CSS.escape(k)}"]`).forEach(o => o.innerHTML = realText(+el.dataset.usd, v));
});

document.addEventListener("change", async ev => {
  if (ev.target.id !== "impf" || !ev.target.files[0]) return;
  try {
    const j = JSON.parse(await ev.target.files[0].text());
    if (!confirm("Sicherung laden? Aktuelle Liste und Watchlist werden ersetzt.")) return;
    ledger = j.ledger || []; watch = j.watch || {}; realP = j.realP || realP; store.set("realT", realP);
    store.set("ledger", ledger); store.set("watch", watch); render();
  } catch { alert("Datei konnte nicht gelesen werden."); }
});

document.addEventListener("submit", ev => {
  if (ev.target.id !== "lf") return;
  ev.preventDefault();
  const f = new FormData(ev.target), buy = num(f.get("buy"));
  if (buy == null) { alert("Bitte Kaufpreis angeben."); return; }
  ledger.unshift({name: f.get("name").trim(), date: f.get("date"), buy, costs: num(f.get("costs")) || 0,
    fee: num(f.get("fee")) ?? 5, sell: num(f.get("sell"))});
  store.set("ledger", ledger); render();
});

(async () => {
  render();
  try {
    D = await (await fetch("data.json?" + Date.now())).json();
    const upd = new Date(D.updated);
    $("#upd").textContent = "Stand: " + upd.toLocaleString("de-AT", {dateStyle: "medium", timeStyle: "short"}) + " · 1 $ = " + D.fx.toFixed(3).replace(".", ",") + " €";
    render();
    store.set("lastVisit", D.today);
  } catch {
    $("#upd").textContent = "Daten konnten nicht geladen werden – läuft das tägliche Update schon?";
    render();
  }
})();
</script>
</body>
</html>
